# MME-0082: CI builds and tests the repository on every push to main and every pull request,
# on a Node 20/22 matrix, so correctness no longer depends on one laptop.
#
# Scope boundary: the `test` job runs only the deterministic suite. `npm test` contains zero
# `visual:*` entries, so no exclusion filtering is needed there.
#
# MME-0114 SUPERSEDES the MME-0082 criterion that said the browser gates never run in CI. That
# rule is exactly why 40 of 71 gates were red the first time anything ran them as a set, five
# broken by MME-0088 with no test turning red and two red for weeks unnoticed. They now run in
# their own `visual-gates` job below, separate from `npm test` because they need a real Chrome
# and live dev servers. The Next.js docs-site build inside `npm test` (`build:docs-site`)
# is a static-site build (no browser, no network fetch beyond local generation) and runs headless
# on Ubuntu without special handling.
#
# MME-0083 re-added `npm run test:consumer-matrix` below: it fixes the `@emnapi/core`/
# `@napi-rs/wasm-runtime` pnpm peer-dependency mismatch (an upstream vite@^8/Rolldown issue,
# unrelated to any @momentarise/* package — reproduced in isolation with a bare `vite`
# devDependency alone) via a pnpm-workspace.yaml override in every pnpm-strict consumer leg. See
# scripts/consumer-smoke.mjs's `externalPeerOverrides` comment for the full reproduction detail.
#
# MME-0085 added the `example-next-app` job below: it builds `examples/next-app/` against the
# real published `@momentarise/*@alpha` registry packages, and separately runs the React 19
# StrictMode-survival regression check (`test:react19-strictmode-lifecycle`). Both depend on a real
# npm registry install (the example's own deps, and the isolated fixture at
# tests/fixtures/react19-strictmode/), so this job deliberately runs only on a weekly schedule and
# on manual `workflow_dispatch`, not on every push/PR — its purpose is catching registry drift (a
# future alpha publish breaking the example, or breaking under React 19) between publishes, not
# gating normal development. The equivalent `npm run test:example-next-registry` and
# `npm run test:react19-strictmode-lifecycle` scripts are available to run locally at any time, but
# both are deliberately excluded from the main `npm test` chain (same reasoning as
# `test:source-keymap-integrity`'s pre-existing exclusion) so ordinary pushes/PRs are not slowed
# down or made flaky by a real registry install; this scheduled job is where that coverage lives.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Cache npm data
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install
        run: npm ci

      # `npm run build` must run before `npm test`: the first test script (`test:contracts`)
      # type-checks packages (e.g. md-cli) that import @momentarise/md-render-html by real
      # package resolution (it is not in tsconfig.tests.json's path-mapping), which requires
      # that package's gitignored `dist/` to already exist. `dist/` only survives locally
      # because of prior local builds; a clean `npm ci` checkout has none.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Consumer matrix
        run: npm run test:consumer-matrix

  # MME-0114: the browser visual gates, as their own job.
  #
  # They stay out of `npm test` because they need a real Chrome and live dev servers, which is
  # exactly why they rotted: 40 of 71 were red the first time anything ran them as a suite, five
  # of those broken by MME-0088 with no test turning red, and two red for weeks unnoticed. The
  # deterministic half of the contract (manifest completeness, failable scripts, non-destructive
  # artifact handling) runs inside `npm test` as `test:visual-gate-integrity`; this job runs the
  # browsers.
  #
  # `npm run visual` starts the demo and docs-site dev servers itself and tears them down, so this
  # job needs nothing but Chrome. ubuntu-latest ships Google Chrome preinstalled; CHROME_BIN pins
  # it for scripts/chrome-helpers.mjs. The `registry` and `theia` gate groups are deliberately not
  # selected here: they need a real npm-registry install and a Theia build respectively, and the
  # runner reports them as `not-selected` in its JSON summary rather than skipping them silently.
  #
  # Locally this is the same one command: `npm run visual`.
  visual-gates:
    runs-on: ubuntu-latest
    # 71 gates, sequential, 300s cap each. The observed full-suite time is ~9-45 minutes.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # ubuntu-24.04 restricts unprivileged user namespaces through AppArmor, which stops Chrome
      # launching as the non-root runner user. None of the 76 gate scripts passes `--no-sandbox`
      # (they are written for a developer laptop), so relax the restriction for the job rather
      # than editing every script. If this ever stops working, the alternative is a shared
      # `chromeLaunchArgs()` in scripts/chrome-helpers.mjs.
      - name: Allow Chrome's sandbox to start
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi

      - name: Run visual gates
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run visual

      - name: Upload visual gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-gate-report
          path: docs/internal/visual-checks/visual-gate-report.json

      # MME-0116: screenshots stopped being committed here. They re-render on every run, so
      # a tracked PNG recorded drift rather than evidence and made "run the suite before you
      # commit" fight "commit only your issue" — MME-0123's run dirtied 242 of them, none
      # caused by its change. This upload is where a human now looks at what a gate rendered;
      # the committed result.json and README next to it are what a human diffs.
      - name: Upload visual gate screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-gate-screenshots
          path: docs/internal/visual-checks/**/*.png
          if-no-files-found: error
          retention-days: 30

  example-next-app:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Real registry install of the example + build, plus the MME-0100 workspace md-theme overlay
      # (the packaged component stylesheet is not in the published alpha yet). See the test file for
      # detail; the React 19 StrictMode regression check runs in the same spirit.
      - name: Example registry build (with md-theme overlay)
        run: npm run test:example-next-registry

      # MME-0114 removed an accidental duplicate of this step.
      - name: React 19 StrictMode regression check
        run: npm run test:react19-strictmode-lifecycle

      # MME-0114: the `registry` gate group runs against the real published packages, so it
      # belongs to this scheduled job rather than to every push. Without it, four gates would be
      # in the manifest and run by nothing — the state MME-0114 exists to end.
      - name: Registry visual gates
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run visual -- --groups registry
