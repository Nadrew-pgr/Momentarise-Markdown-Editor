# MME-0082: CI builds and tests the repository on every push to main and every pull request,
# on a Node 20/22 matrix, so correctness no longer depends on one laptop.
#
# Scope boundary: this workflow runs only the deterministic suite. It deliberately does NOT run
# any `visual:mme-*` script (scripts/visual-check-mme*.mjs) or anything under `docs/internal/
# visual-checks/` generation — those scripts drive a real local browser via the Claude_Browser
# preview tooling and are for human/agent-in-the-loop visual verification (see AGENT.md's UI
# visual verification gate), not headless CI. `npm test` itself contains zero `visual:*` entries,
# so no exclusion filtering is needed here; this comment documents that boundary explicitly per
# the MME-0082 acceptance criteria. The Next.js docs-site build inside `npm test` (`build:docs-site`)
# is a static-site build (no browser, no network fetch beyond local generation) and runs headless
# on Ubuntu without special handling.
#
# MME-0083 re-added `npm run test:consumer-matrix` below: it fixes the `@emnapi/core`/
# `@napi-rs/wasm-runtime` pnpm peer-dependency mismatch (an upstream vite@^8/Rolldown issue,
# unrelated to any @momentarise/* package — reproduced in isolation with a bare `vite`
# devDependency alone) via a pnpm-workspace.yaml override in every pnpm-strict consumer leg. See
# scripts/consumer-smoke.mjs's `externalPeerOverrides` comment for the full reproduction detail.
#
# MME-0085 added the `example-next-app` job below: it builds `examples/next-app/` against the
# real published `@momentarise/*@alpha` registry packages, and separately runs the React 19
# StrictMode-survival regression check (`test:react19-strictmode-lifecycle`). Both depend on a real
# npm registry install (the example's own deps, and the isolated fixture at
# tests/fixtures/react19-strictmode/), so this job deliberately runs only on a weekly schedule and
# on manual `workflow_dispatch`, not on every push/PR — its purpose is catching registry drift (a
# future alpha publish breaking the example, or breaking under React 19) between publishes, not
# gating normal development. The equivalent `npm run test:example-next-registry` and
# `npm run test:react19-strictmode-lifecycle` scripts are available to run locally at any time, but
# both are deliberately excluded from the main `npm test` chain (same reasoning as
# `test:source-keymap-integrity`'s pre-existing exclusion) so ordinary pushes/PRs are not slowed
# down or made flaky by a real registry install; this scheduled job is where that coverage lives.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Cache npm data
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install
        run: npm ci

      # `npm run build` must run before `npm test`: the first test script (`test:contracts`)
      # type-checks packages (e.g. md-cli) that import @momentarise/md-render-html by real
      # package resolution (it is not in tsconfig.tests.json's path-mapping), which requires
      # that package's gitignored `dist/` to already exist. `dist/` only survives locally
      # because of prior local builds; a clean `npm ci` checkout has none.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Consumer matrix
        run: npm run test:consumer-matrix

  example-next-app:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Real registry install of the example + build, plus the MME-0100 workspace md-theme overlay
      # (the packaged component stylesheet is not in the published alpha yet). See the test file for
      # detail; the React 19 StrictMode regression check runs in the same spirit.
      - name: Example registry build (with md-theme overlay)
        run: npm run test:example-next-registry

      - name: React 19 StrictMode regression check
        run: npm run test:react19-strictmode-lifecycle

      - name: React 19 StrictMode regression check
        run: npm run test:react19-strictmode-lifecycle
